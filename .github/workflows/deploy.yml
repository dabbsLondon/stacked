name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys stepping on each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          # Served from https://<user>.github.io/<repo>/ so Vite needs the base.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional Supabase env. If you haven't set these secrets the app
          # still builds and runs in pure-localStorage mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SPA fallback
        # GitHub Pages serves a 404 for any path that doesn't exist; making
        # 404.html identical to index.html lets the SPA handle routes / hard
        # refreshes / magic-link redirects without a server-side rewrite.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
